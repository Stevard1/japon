<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japon">
<meta name="theme-color" content="#0e1422">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Japon</title>
<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#0e1422;color:#ece8df;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.lock{min-height:100%;box-sizing:border-box;display:grid;place-content:center;justify-items:center;gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.lock img{width:88px;height:88px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-size:28px;font-weight:700;letter-spacing:.01em}
p{margin:0;color:#9aa3b8;font-size:14px;line-height:1.45;max-width:280px}
form{display:grid;gap:10px;width:min(300px,82vw);margin-top:4px}
input{font:inherit;font-size:17px;color:#ece8df;background:#121a2b;border:1px solid #26304a;border-radius:12px;padding:13px 14px;outline:none;text-align:center}
input:focus{border-color:#7fa8db}
button{font:inherit;font-size:16px;font-weight:600;color:#fff;background:#2f6fdc;border:0;border-radius:12px;padding:13px;cursor:pointer}
button[disabled]{opacity:.6}
.err{min-height:20px;color:#ff8a8a;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="lock" id="lock" hidden>
  <img src="icons/icon-192.png" alt="">
  <h1>Accès réservé</h1>
  <p>Entrez le mot de passe partagé pour ouvrir la carte. Il ne sera demandé qu'une fois sur ce téléphone.</p>
  <form id="f" autocomplete="on">
    <input id="pw" type="password" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Mot de passe" required>
    <button id="go" type="submit">Ouvrir</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script>
(() => {
const C = {"salt":"lHcfzFlm9qtIX3nEaC50tw==","iter":400000};
const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const $ = id => document.getElementById(id);
const store = { get(){ try { return localStorage.getItem("jp-key"); } catch (e) { return null; } }, set(v){ try { v ? localStorage.setItem("jp-key", v) : localStorage.removeItem("jp-key"); } catch (e) {} } };
async function openApp(key, remember){
  const r = await fetch("app.enc", {cache: "no-cache"}).catch(() => fetch("app.enc"));
  if (!r.ok) throw new Error("réseau");
  const buf = await r.arrayBuffer();
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: new Uint8Array(buf, 0, 12)}, key, new Uint8Array(buf, 12));
  if (remember) store.set(b64(await crypto.subtle.exportKey("raw", key)));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
function showLock(msg){ $("lock").hidden = false; $("err").textContent = msg || ""; }
(async () => {
  if (!window.crypto || !crypto.subtle) return showLock("Ouvrez ce lien dans Safari (https).");
  const saved = store.get();
  if (saved) {
    try { await openApp(await crypto.subtle.importKey("raw", u8(saved), "AES-GCM", true, ["decrypt"]), false); return; }
    catch (e) { if (e.name === "OperationError") { store.set(null); return showLock("Le mot de passe a changé : entrez le nouveau."); } return showLock("Connexion impossible pour l'instant. Réessayez avec du réseau."); }
  }
  showLock();
})();
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("pw").value.normalize("NFC").toLowerCase().replace(/[\s\-_.]/g, "");
  if (!pw) return;
  $("go").disabled = true; $("err").textContent = "";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: u8(C.salt), iterations: C.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
    await openApp(key, true);
  } catch (err) {
    $("go").disabled = false;
    $("err").textContent = err.name === "OperationError" ? "Mot de passe incorrect." : "Connexion impossible pour l'instant.";
    $("pw").select();
  }
});
})();
</script>
</body>
</html>
